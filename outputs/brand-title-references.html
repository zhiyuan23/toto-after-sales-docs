  <script>
    (() => {
      const root = document.getElementById('brand-title-references');
      if (globalThis.Tweak) {
        root.querySelectorAll('.sample').forEach(sample => {
          const state = { fontSize: sample.classList.contains('b') || sample.classList.contains('c') ? 15 : 14, radius: sample.classList.contains('b') ? 6 : sample.classList.contains('c') ? 5 : 4 };
          const label = sample.querySelector('.sub');
          const tweak = new Tweak({ container: sample, onChange: () => { label.style.fontSize = state.fontSize + 'px'; label.style.borderRadius = state.radius + 'px'; } });
          tweak.addSlider(state, 'fontSize', { label: '子标题字号', min: 12, max: 17, unit: 'px' });
          tweak.addSlider(state, 'radius', { label: '圆角', min: 2, max: 13, unit: 'px' });
        });
      }
    })();
  </script>
