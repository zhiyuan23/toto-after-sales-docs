<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>TOTO 售后服务 · 工单流转</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="presentation">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="TOTO 工单流转演示首页">TOTO<span>售后服务</span></a>
      <div class="topbar-actions"><button id="theme" class="quiet" aria-label="切换深浅主题">深色</button><button id="fullscreen" class="quiet">全屏</button></div>
    </header>
    <section class="intro" aria-labelledby="headline">
      <h1 id="headline">一张工单，<span>服务全程协同。</span></h1>
      <div class="mode-switch" role="group" aria-label="选择分配模式"><button data-mode="manual" aria-pressed="false">人工分配</button><button data-mode="smart" aria-pressed="true">智能分配</button><span class="mode-thumb" aria-hidden="true"></span></div>
    </section>
    <section class="stage" aria-label="工单跨角色流转演示">
      <div class="stage-heading"><h2 id="step-title">消费者发起服务申请</h2><span class="scene-label">场景示意</span></div>
      <svg id="flow" viewBox="0 0 1440 560" role="group" aria-labelledby="flow-title flow-description">
        <title id="flow-title">一张工单在四个角色之间流转</title>
        <desc id="flow-description">沿线流动的点阵表示交接方向，移动工单表示当前状态。点击角色或下方阶段可以跳转。</desc>
        <defs>
          <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" class="grid-dot"/></pattern>
          <linearGradient id="request-gradient" gradientUnits="userSpaceOnUse" x1="226" y1="177.6" x2="570.5" y2="78.4"><stop stop-color="var(--consumer)"/><stop offset="1" stop-color="var(--customer)"/></linearGradient>
          <linearGradient id="dispatch-gradient" gradientUnits="userSpaceOnUse" x1="736.9" y1="84.8" x2="1217.9" y2="180.8"><stop stop-color="var(--customer)"/><stop offset="1" stop-color="var(--station)"/></linearGradient>
          <linearGradient id="assign-gradient" gradientUnits="userSpaceOnUse" x1="1246.5" y1="250.4" x2="886.4" y2="416"><stop stop-color="var(--station)"/><stop offset="1" stop-color="var(--worker)"/></linearGradient>
          <linearGradient id="contact-gradient" gradientUnits="userSpaceOnUse" x1="729.1" y1="418.4" x2="145.4" y2="260"><stop stop-color="var(--worker)"/><stop offset="1" stop-color="var(--consumer)"/></linearGradient>
          <linearGradient id="review-gradient" gradientUnits="userSpaceOnUse" x1="830.5" y1="368.8" x2="721.3" y2="106.4"><stop stop-color="var(--worker)"/><stop offset="1" stop-color="var(--customer)"/></linearGradient>
          <linearGradient id="close-gradient" gradientUnits="userSpaceOnUse" x1="573.1" y1="95.2" x2="198.7" y2="166.4"><stop stop-color="var(--customer)"/><stop offset="1" stop-color="var(--consumer)"/></linearGradient>
          <marker id="arrow-consumer" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="var(--consumer)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
          <marker id="arrow-customer" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="var(--customer)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
          <marker id="arrow-station" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="var(--station)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
          <marker id="arrow-worker" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="var(--worker)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
        </defs>
        <rect width="1440" height="560" fill="url(#grid)"/>
        <ellipse cx="720" cy="260" rx="470.6" ry="184.8" class="orbit"/><ellipse cx="720" cy="260" rx="406.9" ry="147.2" class="orbit inner-orbit"/>
        <text x="720" y="268" text-anchor="middle" class="center-word">服务协同</text>
        <g class="connection" data-route="request" style="--route-color:var(--customer)"><path id="path-request" class="rail" d="M226 177.6 C336.5 91.2 458.7 60 570.5 78.4" stroke="url(#request-gradient)" marker-end="url(#arrow-customer)"/><g class="particles" aria-hidden="true"></g></g>
        <g class="connection" data-route="dispatch" style="--route-color:var(--station)"><path id="path-dispatch" class="rail" d="M736.9 84.8 C951.4 56 1113.9 103.2 1217.9 180.8" stroke="url(#dispatch-gradient)" marker-end="url(#arrow-station)"/><g class="particles" aria-hidden="true"></g></g>
        <g class="connection" data-route="assign" style="--route-color:var(--worker)"><path id="path-assign" class="rail" d="M1246.5 250.4 C1160.7 359.2 1002.1 416 886.4 416" stroke="url(#assign-gradient)" marker-end="url(#arrow-worker)"/><g class="particles" aria-hidden="true"></g></g>
        <g class="connection" data-route="contact" style="--route-color:var(--consumer)"><path id="path-contact" class="rail" d="M729.1 418.4 C426.2 476 157.1 381.6 145.4 260" stroke="url(#contact-gradient)" marker-end="url(#arrow-consumer)"/><g class="particles" aria-hidden="true"></g></g>
        <g class="connection" data-route="review" style="--route-color:var(--customer)"><path id="path-review" class="rail" d="M830.5 368.8 C970.9 255.2 890.3 142.4 721.3 106.4" stroke="url(#review-gradient)" marker-end="url(#arrow-customer)"/><g class="particles" aria-hidden="true"></g></g>
        <g class="connection" data-route="close" style="--route-color:var(--consumer)"><path id="path-close" class="rail" d="M573.1 95.2 C405.4 86.4 281.9 141.6 198.7 166.4" stroke="url(#close-gradient)" marker-end="url(#arrow-consumer)"/><g class="particles" aria-hidden="true"></g></g>
        <g class="role-node" data-role="consumer" role="button" tabindex="0" aria-label="消费者：查看建单环节" transform="translate(154.5 208)">
          <circle r="76" class="node-halo"/><circle r="63" class="node-wave"/><circle r="55" class="node-disc"/><text y="13" text-anchor="middle" class="node-mark">客</text><text y="101" text-anchor="middle" class="node-name">消费者</text>
        </g>
        <g class="role-node" data-role="customer" role="button" tabindex="0" aria-label="客服：查看分站环节" transform="translate(655 84)">
          <circle r="76" class="node-halo"/><circle r="63" class="node-wave"/><circle r="55" class="node-disc"/><text y="13" text-anchor="middle" class="node-mark">服</text><text y="101" text-anchor="middle" class="node-name">客服</text>
        </g>
        <g class="role-node" data-role="station" role="button" tabindex="0" aria-label="服务站：查看派人环节" transform="translate(1292 208)">
          <circle r="76" class="node-halo"/><circle r="63" class="node-wave"/><circle r="55" class="node-disc"/><text y="13" text-anchor="middle" class="node-mark">站</text><text y="101" text-anchor="middle" class="node-name">服务站</text>
        </g>
        <g class="role-node" data-role="worker" role="button" tabindex="0" aria-label="服务人员：查看预约环节" transform="translate(804.5 416)">
          <circle r="76" class="node-halo"/><circle r="63" class="node-wave"/><circle r="55" class="node-disc"/><text y="13" text-anchor="middle" class="node-mark">师</text><text y="101" text-anchor="middle" class="node-name">服务人员</text>
        </g>
        <g id="order-position" style="transform:translate(271.5px,171.2px)">
          <g class="order-art">
            <rect x="9" y="9" width="266" height="139" rx="20" class="order-back"/>
            <rect x="4" y="4" width="266" height="139" rx="20" class="order-middle"/>
            <rect width="266" height="139" rx="20" class="order-face"/>
            <rect x="23" y="23" width="5" height="16" rx="2" class="order-accent"/>
            <text x="39" y="36" class="order-label">服务工单</text>
            <text x="23" y="82" id="order-status" class="order-status">待分站</text>
            <text x="23" y="113" id="order-owner" class="order-owner">消费者</text>
          </g>
        </g>
        <g id="completion" opacity="0" aria-hidden="true"><ellipse cx="720" cy="260" rx="504.4" ry="199.2" class="completion-ring"/><ellipse cx="720" cy="260" rx="546" ry="218.4" class="completion-ring"/></g>
      </svg>
    </section>
    <footer class="footer">
      <nav class="timeline" aria-label="流转阶段"><div class="timeline-track"><div id="timeline-fill" class="timeline-fill"></div></div><button data-phase="0" aria-current="step"><span class="timeline-dot"></span>申请</button><button data-phase="1"><span class="timeline-dot"></span>分站派人</button><button data-phase="2"><span class="timeline-dot"></span>预约履约</button><button data-phase="3"><span class="timeline-dot"></span>审核</button><button data-phase="4"><span class="timeline-dot"></span>办结</button></nav>
      <div class="controls"><button id="reset" class="quiet" aria-label="重新开始">重播</button><button id="previous" class="secondary" aria-label="上一步" disabled>←</button><button id="next" class="secondary" aria-label="下一步">→</button><button id="play" class="primary">播放流转 <span aria-hidden="true">▶</span></button></div>
    </footer>
    <div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
